[project]
name = "solti-sdk"
version = "0.1.3"
description = "Solti Platform Python SDK — schedule and run asynchronous workloads without managing infrastructure."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Solti", email = "support@solti.run" }]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solti"]

[tool.hatch.build.targets.sdist]
# terraform/ (Change 069 WS5 teardown) and its .terraform cache must never
# ship in the sdist — the 0.1.2 sdist accidentally included it (32.9 MiB).
exclude = ["terraform", ".terraform"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
